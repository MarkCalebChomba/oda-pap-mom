<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Category - Oda Pap</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script type="module" src="category.js"></script>
    <div id="loading-overlay">
        <div class="loader">
            <div class="loader-content">
                <img src="images/loader.gif" alt="Loading..." class="loader-gif">
                <p>Loading...</p>
            </div>
        </div>
    </div>
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo-container">
                <img src="images/logo.jpg" alt="Oda Pap Logo" class="logo">
                <span class="logo-text">Oda Pap</span>
            </div>
            <div class="search-container">
                <form id="searchForm">
                    <input type="text" id="searchInput" placeholder="Search...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
                <div id="searchSuggestions" class="suggestions">
                    <!-- Suggestions will be dynamically populated here -->
                </div>
            </div>
            <div class="top-icons">
                <div class="menu-icon" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                    <p>Menu</p>
                </div>
                <div class="dropdown-content" id="dropdown">
                    <a href="category.html?category=student-centre" class="category">
                        <i class="fas fa-graduation-cap"></i>
                        <p>Student Centre</p>
                    </a>
                    <a href="category.html?category=electronics" class="category">
                        <i class="fas fa-tv"></i>
                        <p>Electronics</p>
                    </a>
                    <a href="category.html?category=kitchenware" class="category">
                        <i class="fas fa-blender"></i>
                        <p>Kitchenware</p>
                    </a>
                    <a href="category.html?category=furniture" class="category">
                        <i class="fas fa-couch"></i>
                        <p>Furniture</p>
                    </a>
                    <a href="category.html?category=fashion" class="category">
                        <i class="fas fa-tshirt"></i>
                        <p>Fashion</p>
                    </a>
                    <a href="category.html?category=beauty" class="category">
                        <i class="fas fa-heart"></i>
                        <p>Beauty</p>
                    </a>
                    <a href="category.html?category=rentals" class="category">
                        <i class="fas fa-building"></i>
                        <p>Rentals</p>
                    </a>
                    <a href="category.html?category=service-men" class="category">
                        <i class="fas fa-tools"></i>
                        <p>Service Men</p>
                    </a>
                    <a href="category.html?category=foodstuffs" class="category">
                        <i class="fas fa-carrot"></i>
                        <p>Foodstuffs</p>
                    </a>
                    <a href="category.html?category=phones" class="category">
                        <i class="fas fa-mobile-alt"></i>
                        <p>Phones</p>
                    </a>
                    <a href="category.html?category=accessories" class="category">
                        <i class="fas fa-headphones"></i>
                        <p>Accessories</p>
                    </a>
                    <a href="category.html?category=pharmaceutical" class="category">
                        <i class="fas fa-pills"></i>
                        <p>Pharmaceutical</p>
                    </a>
                    <a href="category.html?category=kids" class="category">
                        <i class="fas fa-hat-wizard"></i>
                        <p>Kids</p>
                    </a>
                </div>
                <script>
                    // Define the toggleMenu function globally
                    window.toggleMenu = function() {
                        const dropdown = document.getElementById('dropdown');
                        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
                    };

                    // Close the dropdown if clicked outside
                    window.onclick = function(event) {
                        if (!event.target.matches('.menu-icon') && !event.target.matches('.menu-icon *')) {
                            const dropdown = document.getElementById('dropdown');
                            if (dropdown.style.display === 'block') {
                                dropdown.style.display = 'none';
                            }
                        }
                    };
                </script>
            </div>
        </div>
        <div class="border-line"></div>
        <div class="nav-bar" id="nav-bar">
            <button class="home-button" onclick="location.href='index.html'"><i class="fas fa-home"></i></button>
            <button class="home-button" onclick="location.href='notification.html'" style="position: relative;">
                <i class="fas fa-bell" id="notification-icon"></i>
                <span class="cart-notification"></span>
            </button>
            <button class="home-button" onclick="location.href='cart.html'" style="position: relative;">
                <i class="fas fa-shopping-cart" id="cart-icon"></i>
                <span class="cart-notification"></span>
            </button>
            <button class="home-button" onclick="location.href='wishlist.html'" style="position: relative;">
                <i class="fas fa-heart" id="wishlist-icon"></i>
                <span class="cart-notification"></span>
            </button>
            <button class="home-button" onclick="location.href='profile.html'" style="position: relative;">
                <i class="fas fa-user-circle"></i>
                <span id="profile-notification" class="blinking-notification" style="display: none;"></span>
            </button>
        </div>
    </header>
    <main>
        <div class="category-header">
            <i id="category-icon" class="category-icon"></i>
            <h1 id="category-title">Category</h1>
            <p id="category-description" class="category-description"></p>
        </div>
        <button id="filterToggleButton" class="filter-toggle-button"><i class="fas fa-filter"></i></button>
        <form id="filterForm" class="filter-form">
            <label for="orderBy">Order By:</label>
            <div class="filter-group">
                <label><input type="radio" name="orderBy" value="dateUploaded" checked> Date Uploaded</label>
                <label><input type="radio" name="orderBy" value="age"> Age</label>
                <label><input type="radio" name="orderBy" value="condition"> Condition</label>
            </div>
            <label for="orderDirection">Order Direction:</label>
            <div class="filter-group">
                <label><input type="radio" name="orderDirection" value="asc" checked> Ascending</label>
                <label><input type="radio" name="orderDirection" value="desc"> Descending</label>
            </div>
            <label for="priceRange">Price Range:</label>
            <select id="priceRange" name="priceRange">
                <option value="">Select Price Range</option>
                <option value="0-1000">0 - 1000</option>
                <option value="1000-5000">1000 - 5000</option>
                <option value="5000-10000">5000 - 10000</option>
                <option value="10000-20000">10000 - 20000</option>
                <option value="20000-50000">20000 - 50000</option>
                <option value="50000-100000">50000 - 100000</option>
                <option value="100000-200000">100000 - 200000</option>
                <option value="200000-500000">200000 - 500000</option>
                <option value="500000-1000000">500000 - 1000000</option>
            </select>
            <button type="submit">Apply Filters</button>
        </form>
        <section class="gallery" id="category-gallery">
            <div id="listings-container" class="listings-container">
                <!-- Listings will be dynamically inserted here -->
            </div>
        </section>
        <nav>
            <div id="auth-status">
                <p>:</p>
                <!-- User status and logout button will be dynamically inserted here -->
            </div>
        </nav>
    </main>
    <footer>
        <button class="floating-button" onclick="location.href='listing.html'">
            <i class="fas fa-plus"></i>
            <span class="button-text">Sell Now</span>
            <div class="fire-animation"></div>
        </button>
        <p>&copy; 2024 Oda Pap. All Rights Reserved.</p>
        <div class="footer-content">
            <h3>Follow Us</h3>
            <ul class="socials">
                <li><a href="https://www.facebook.com/yourprofile" target="_blank"><i class="fab fa-facebook-f"></i></a></li>
                <li><a href="https://www.twitter.com/yourprofile" target="_blank"><i class="fab fa-twitter"></i></a></li>
                <li><a href="https://www.instagram.com/yourprofile" target="_blank"><i class="fab fa-instagram"></i></a></li>
                <li><a href="https://www.linkedin.com/in/yourprofile" target="_blank"><i class="fab fa-linkedin-in"></i></a></li>
                <li><a href="https://www.pinterest.com/yourprofile" target="_blank"><i class="fab fa-pinterest"></i></a></li>
            </ul>
        </div>
    </footer>
    <script src="category.js" type="module"></script>
</body>
</html>
